<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小游戏合集 · 主页</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0f1923;
  color: #e0e0e0;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ===== 顶部导航栏 ===== */
.navbar {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  background: rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.12);
  flex-shrink: 0;
}
.navbar .logo {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
  margin-right: 16px;
  white-space: nowrap;
}
.navbar a {
  text-decoration: none;
  color: #cdd6e0;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.navbar a:hover { background: rgba(255,255,255,0.08); color: #fff; }

/* ===== 主页：竖向游戏列表 ===== */
.home-view {
  flex: 1;
  overflow-y: auto;
  padding: 36px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.home-view h2 {
  font-size: 26px;
  letter-spacing: 2px;
  color: #fff;
  margin-bottom: 30px;
}
.game-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 520px;
}
.game-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 22px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  cursor: pointer;
  transition: transform .15s, border-color .15s, background .15s;
}
.game-item:hover {
  transform: translateX(6px);
  border-color: rgba(74,144,217,0.6);
  background: rgba(74,144,217,0.08);
}
.game-item .icon { font-size: 30px; }
.game-item .info { flex: 1; }
.game-item .name { font-size: 18px; font-weight: 600; color: #fff; }
.game-item .desc { font-size: 13px; opacity: 0.55; margin-top: 4px; }
.game-item .play {
  padding: 8px 18px;
  border: none; border-radius: 6px;
  background: #4a90d9; color: #fff;
  font-size: 14px; letter-spacing: 1px;
}

/* ===== 游戏区域 ===== */
.game-area { flex: 1; display: none; min-height: 0; }
#game-frame { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

<!-- ===== 导航栏 ===== -->
<nav class="navbar">
  <span class="logo">🎮 小游戏合集</span>
  <a id="btn-home" href="#">🏠 主页</a>
</nav>

<!-- ===== 主页：竖向游戏列表 ===== -->
<div class="home-view" id="home-view">
  <h2>选择游戏</h2>
  <div class="game-list">
    <div class="game-item" data-game="gomoku">
      <span class="icon">⚫⚪</span>
      <div class="info">
        <div class="name">五子棋</div>
        <div class="desc">五连制胜 · 进攻/防守难度 · 禁手规则</div>
      </div>
      <button class="play" >开始</button>
    </div>

    <div class="game-item" data-game="othello">
      <span class="icon">🀄</span>
      <div class="info">
        <div class="name">黑白棋</div>
        <div class="desc">经典翻转对战 · 三档 AI 难度</div>
      </div>
      <button class="play" >开始</button>
    </div>

    <div class="game-item" data-game="sum10">
      <span class="icon">🧮</span>
      <div class="info">
        <div class="name">数字消除</div>
        <div class="desc">选择矩形区域 · 数字之和恰好为 10</div>
      </div>
      <button class="play" >开始</button>
    </div>

    <div class="game-item" data-game="mines">
      <span class="icon">💣</span>
      <div class="info">
        <div class="name">扫雷</div>
        <div class="desc">经典扫雷 · 初级 / 中级 / 高级</div>
      </div>
      <button class="play" >开始</button>
    </div>

    <div class="game-item" data-game="snake">
      <span class="icon">🐍</span>
      <div class="info">
        <div class="name">贪吃蛇</div>
        <div class="desc">经典贪吃蛇</div>
      </div>
      <button class="play" >开始</button>
    </div>
  </div>
</div>

<!-- ===== 游戏区域 ===== -->
<div class="game-area" id="game-area">
  <iframe id="game-frame" title="游戏区域"></iframe>
</div>

<script>
'use strict';
const GAMES = {
  gomoku:  'game/gomoku.html',
  othello: 'game/othello.html',
  sum10:   'game/Sum10.html',
  mines:   'game/mine-sweeper.html',
  snake:   'game/snake.html'
};

const frame     = document.getElementById('game-frame');
const homeView  = document.getElementById('home-view');
const gameArea  = document.getElementById('game-area');
let currentGame = null;

function showHome() {
  gameArea.style.display = 'none';
  homeView.style.display = 'flex';
}

function openGame(id) {
  if (!GAMES[id]) return;
  // 同游戏且 iframe 已加载：保留状态，不做任何事（切换导航也不丢进度）
  if (currentGame === id && frame.src.includes(GAMES[id])) return;
  homeView.style.display = 'none';
  gameArea.style.display = 'flex';
  frame.src = GAMES[id];
  currentGame = id;
}

document.querySelectorAll('.game-item').forEach(item => {
  item.addEventListener('click', () => openGame(item.dataset.game));
});

// 导航栏"主页"：返回游戏列表（iframe 保留在 DOM 中，游戏进度不丢失）
document.getElementById('btn-home').addEventListener('click', e => {
  e.preventDefault();
  showHome();
});
</script>
</body>
</html>
